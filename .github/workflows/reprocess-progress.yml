name: reprocess progress

# 不重爬學校系統、只用既有 canonical 重算逐週進度，然後發佈。
#
# 為什麼需要這支：weekly_progress 是**衍生欄位**，parser 一升版就得重產。但唯一會
# 寫出它的 crawl-details.yml 每次都要重爬全學期課綱（~5k 請求、timeout 180 分），
# 排程又是週更——等於 parser 改一個 regex 要等到下週日才會反映到線上。
# 這支把「重算」與「重爬」拆開：讀 data branch 上既有的 details.ndjson，
# 重跑 parser、寫回、發佈。實測全學期約 5 秒。
#
# 只有手動觸發，沒有排程：它不產生新資料，跑它的唯一理由是 parser_version 變了。
on:
  workflow_dispatch:
    inputs:
      terms:
        description: "學期（如 115-1 或 110-1:115-1）；留空＝自動偵測當前學期"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: data-pipeline   # 與 crawl.yml / crawl-details.yml / crawl-enrollment.yml 共用
  cancel-in-progress: false

jobs:
  reprocess:
    runs-on: ubuntu-latest
    env:
      R2_BUCKET: ${{ vars.R2_BUCKET }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      R2_S3_ACCESS_KEY_ID: ${{ secrets.R2_S3_ACCESS_KEY_ID }}
      R2_S3_SECRET_ACCESS_KEY: ${{ secrets.R2_S3_SECRET_ACCESS_KEY }}
    steps:
      - name: Checkout code (main)
        uses: actions/checkout@v4

      - name: Checkout canonical (data branch)
        uses: actions/checkout@v4
        with:
          ref: data
          path: data/canonical

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install crawler
        run: pip install -e ./crawler

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install wrangler
        run: npm install -g wrangler@4

      # 不可信輸入只經由 env 注入，不直接插入 shell（防 command injection）。
      # 這支**不打學校系統**，所以 current-term 偵測（要打 QueryCurrPage）用不了。
      # 沒給就取「最新且**有 details.ndjson**」的學期——只看目錄名會挑到 115-2，
      # 那個目錄是週次表建立的、沒有課綱資料，跑下去會靜默空轉然後照常發佈。
      - name: Resolve terms
        id: terms
        env:
          INPUT_TERMS: ${{ github.event.inputs.terms }}
        run: |
          set -euo pipefail
          T="$INPUT_TERMS"
          if [ -z "$T" ]; then
            T="$(for f in data/canonical/*/details.ndjson; do
                   [ -f "$f" ] && basename "$(dirname "$f")"
                 done | grep -E '^[0-9]{3}-[123]$' | sort | tail -1)"
            echo "auto-detected latest term with syllabus data: $T"
          else
            echo "$T" | grep -Eq '^[0-9]{3}-[123]([:,][0-9]{3}-[123])*$' \
              || { echo "invalid terms: $T"; exit 1; }
          fi
          test -n "$T" || { echo "no term resolved"; exit 1; }
          echo "terms=$T" >> "$GITHUB_OUTPUT"

      - name: Reprocess weekly progress (offline)
        env:
          TERMS: ${{ steps.terms.outputs.terms }}
        run: |
          set -euo pipefail
          python -m ntut_catalog reprocess-progress --terms "$TERMS" --out data

      # 沒有行事曆的話，日期／錨點規則會靜默停用、涵蓋率整批下降。報表會標
      # term_weeks_available: false，這裡把它變成看得見的警告。
      - name: Warn if a term had no calendar
        env:
          TERMS: ${{ steps.terms.outputs.terms }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, pathlib, re
          terms = re.split(r'[,:]', os.environ["TERMS"])
          for t in terms:
              p = pathlib.Path("data/canonical/reports") / t / "weekly-progress.json"
              if not p.exists():
                  continue
              r = json.loads(p.read_text(encoding="utf-8"))
              rate = r["week_cells"]["rate"]
              print(f"{t}: {r['status_counts']} rate={rate:.4f} "
                    f"parser={r['parser_version']}")
              if not r["term_weeks_available"]:
                  print(f"::warning title=缺少週次表::{t} 沒有 calendar.json，"
                        f"逐週進度的日期／錨點規則已停用，涵蓋率會偏低")
          PY

      - name: Redline scan (block PII/secrets/error pages)
        run: python infra/redline_scan.py data/canonical

      - name: Commit to data branch
        working-directory: data/canonical
        env:
          TERMS: ${{ steps.terms.outputs.terms }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          DATE="$(TZ=Asia/Taipei date +%F)"
          git add -- '*/details.ndjson' 'reports/*/weekly-progress.json' || true
          git diff --cached --quiet || git commit -m "data(progress): reprocess $TERMS $DATE"
          git pull --rebase origin data || true
          git push origin HEAD:data

      # derive＝canonical → v1（全量、確定性）。fetch 子命令只寫 canonical，publish 也不重建 v1。
      - name: Derive v1
        run: python -m ntut_catalog derive --out data

      # 全量比對、只傳差異、刪過期檔；品質閘門基準讀線上 manifest（infra/publish.py 檔頭）。
      # 刪除保險觸發 → 其餘照常上線、exit 3 紅燈，確認後用 publish-v1 的 allow_mass_delete 放行。
      - name: Publish v1 to R2
        env:
          QUALITY_MIN_RATIO: ${{ vars.QUALITY_MIN_RATIO }}
        run: python infra/publish.py --bucket "$R2_BUCKET" --out data
