name: crawl calendar

# 每日 03:00 Asia/Taipei（= 19:00 UTC，台北無 DST）抓校網的 Google Calendar ics，
# 產出行事曆事件 feed（契約四）與學年度週次表（契約三）。
#
# 為什麼獨立一支、不掛在 crawl.yml 裡：
#   ① **這支完全不碰學校系統**，資料來自 Google。原本掛在 crawl.yml 時，
#      第一步 `Resolve terms` 要打 aps.ntut.edu.tw 偵測當前學期——學校一不通，
#      整個 job 死在那裡，連跟學校無關的行事曆都跟著停更（2026-09-18 實際發生）。
#   ② Actions 總覽上一支 workflow 一個關注點，紅燈才看得出真正壞的是什麼。
#
# 刻意早 crawl.yml 一小時：兩者共用 data-pipeline concurrency group，錯開避免互等。
on:
  schedule:
    - cron: "0 19 * * *"
  workflow_dispatch:
    inputs:
      terms:
        description: "要產週次表的學期（如 115-1）；留空＝取 canonical 裡最新的學期"
        required: false
        default: ""

permissions:
  contents: write
  issues: write      # horizon 告警開/關 issue

concurrency:
  group: data-pipeline   # 與 crawl.yml / crawl-details.yml / crawl-enrollment.yml 共用
  cancel-in-progress: false

jobs:
  crawl-calendar:
    runs-on: ubuntu-latest
    env:
      R2_BUCKET: ${{ vars.R2_BUCKET }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      R2_S3_ACCESS_KEY_ID: ${{ secrets.R2_S3_ACCESS_KEY_ID }}
      R2_S3_SECRET_ACCESS_KEY: ${{ secrets.R2_S3_SECRET_ACCESS_KEY }}
    steps:
      - name: Checkout code (main)
        uses: actions/checkout@v4

      - name: Checkout canonical (data branch)
        uses: actions/checkout@v4
        with:
          ref: data
          path: data/canonical

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install crawler
        run: pip install -e ./crawler

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install wrangler
        run: npm install -g wrangler@4

      # 不可信輸入只經由 env 注入，不直接插入 shell（防 command injection）。
      # **不用 current-term 偵測**（那要打學校，正是這支要擺脫的依賴）。
      # 改取 canonical 裡最新且有 catalog.ndjson 的學期——crawl.yml 每天維護 canonical，
      # 所以這個推導自動跟著學校走，不需要任何人手動設定。
      - name: Resolve terms
        id: terms
        env:
          INPUT_TERMS: ${{ github.event.inputs.terms }}
        run: |
          set -euo pipefail
          T="$INPUT_TERMS"
          if [ -z "$T" ]; then
            T="$(for f in data/canonical/*/catalog.ndjson; do
                   [ -f "$f" ] && basename "$(dirname "$f")"
                 done | grep -E '^[0-9]{3}-[123]$' | sort | tail -1)"
            echo "auto-detected latest term with catalog data: $T"
          else
            echo "$T" | grep -Eq '^[0-9]{3}-[123]([:,][0-9]{3}-[123])*$' \
              || { echo "invalid terms: $T"; exit 1; }
          fi
          test -n "$T" || { echo "no term resolved"; exit 1; }
          echo "terms=$T" >> "$GITHUB_OUTPUT"

      # crawl-calendar 自己會推導當前學年度的兩個學期（不吃 --terms）；
      # 上面解析出來的 TERMS 只給 publish 用，決定哪些學期的週次表要上傳。
      - name: Crawl academic calendar (ics)
        run: |
          set -euo pipefail
          python -m ntut_catalog crawl-calendar --out data

      # horizon 監測：涵蓋不到下一學年度 → 開 issue；補上了 → 自動關。告警不阻斷發布。
      - name: Calendar horizon alert
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python infra/calendar_horizon_alert.py data

      - name: Redline scan (block PII/secrets/error pages)
        run: python infra/redline_scan.py data/canonical

      - name: Commit calendar to data branch
        working-directory: data/canonical
        env:
          TERMS: ${{ steps.terms.outputs.terms }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          DATE="$(TZ=Asia/Taipei date +%F)"
          # 內容沒變時 crawl-calendar 不重寫檔案 → 這裡自然無 diff、不會產生空 commit，
          # 所以 data branch 上每一個 data(calendar) commit 都代表學校真的改了行事曆。
          git add -- 'calendar/events.ndjson' 'calendar/meta.json' '*/calendar.json' || true
          git diff --cached --quiet || git commit -m "data(calendar): $DATE"
          git pull --rebase origin data || true
          git push origin HEAD:data

      - name: Publish v1 to R2
        env:
          TERMS: ${{ steps.terms.outputs.terms }}
        run: |
          python infra/publish.py \
            --bucket "$R2_BUCKET" \
            --terms "$TERMS" \
            --out data \
            --generated-at "$(date -u +%FT%TZ)"

      # 盯「已發布的週次表涵蓋哪些學期」。horizon 只量 ics 來源的日期範圍，兩者可以
      # 同時成立卻都沒發現問題——2026-09-19 就是 horizon.ok 與 115-2 的 404 並存。
      # 只告警不阻斷：8 月新學年度尚未匯入時缺學期是常態。
      - name: Calendar coverage check
        continue-on-error: true
        run: python infra/calendar_coverage_check.py data
