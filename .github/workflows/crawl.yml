name: crawl catalog

# 每日 04:00 Asia/Taipei（= 20:00 UTC，台北無 DST）爬「當前學期」+ 手動全量。
# 無 push trigger → 對 data branch 的 commit 不會自迴圈。
on:
  schedule:
    - cron: "0 20 * * *"
  workflow_dispatch:
    inputs:
      terms:
        description: "學期（如 115-1 或 110-1:115-1）；留空＝自動偵測當前學期"
        required: false
        default: ""
      force:
        description: "重爬已存在學期"
        type: boolean
        default: true

permissions:
  contents: write
  issues: write      # 行事曆 horizon 告警開/關 issue

concurrency:
  group: data-pipeline   # 與 crawl-enrollment.yml 共用 → 序列化，不撞 data branch / R2
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    env:
      R2_BUCKET: ${{ vars.R2_BUCKET }}
      MIN_RATIO: ${{ vars.QUALITY_MIN_RATIO || '0.95' }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # R2 的 S3 相容憑證。與 CLOUDFLARE_API_TOKEN 來自**同一組** R2 API Token
      # （建立時一次給三個值），設了才會走批次上傳；沒設自動回退 wrangler 逐檔。
      # 對照表見 docs/ARCHITECTURE.md §6。
      R2_S3_ACCESS_KEY_ID: ${{ secrets.R2_S3_ACCESS_KEY_ID }}
      R2_S3_SECRET_ACCESS_KEY: ${{ secrets.R2_S3_SECRET_ACCESS_KEY }}
    steps:
      - name: Checkout code (main)
        uses: actions/checkout@v4

      - name: Checkout canonical (data branch)
        uses: actions/checkout@v4
        with:
          ref: data
          path: data/canonical

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install crawler
        run: pip install -e ./crawler

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install wrangler
        run: npm install -g wrangler@4

      # 不可信輸入只經由 env 注入，不直接插入 shell（防 command injection）
      - name: Resolve terms
        id: terms
        env:
          INPUT_TERMS: ${{ github.event.inputs.terms }}
          ACTIVE_TERMS: ${{ vars.ACTIVE_TERMS }}
        run: |
          set -euo pipefail
          T="$INPUT_TERMS"
          if [ -z "$T" ]; then T="$ACTIVE_TERMS"; fi
          if [ -z "$T" ]; then
            T="$(python -m ntut_catalog current-term)"
            echo "auto-detected current term: $T"
          else
            echo "$T" | grep -Eq '^[0-9]{3}-[123]([:,][0-9]{3}-[123])*$' || { echo "invalid terms: $T"; exit 1; }
          fi
          echo "terms=$T" >> "$GITHUB_OUTPUT"

      - name: Record previous course counts (quality-gate baseline)
        id: prev
        run: |
          set -euo pipefail
          python - "$GITHUB_OUTPUT" <<'PY'
          import json, sys, pathlib
          out = pathlib.Path(sys.argv[1])
          base = pathlib.Path("data/canonical")
          counts = {}
          for d in sorted(base.glob("*/catalog.ndjson")):
              term = d.parent.name
              counts[term] = sum(1 for ln in d.read_text(encoding="utf-8").splitlines() if ln.strip())
          with out.open("a", encoding="utf-8") as f:
              f.write("counts=" + json.dumps(counts) + "\n")
          PY

      - name: Crawl
        env:
          TERMS: ${{ steps.terms.outputs.terms }}
          FORCE: ${{ github.event.inputs.force }}
        run: |
          set -euo pipefail
          # 排程（無輸入）→ 預設 force 重爬以刷新當前學期人數；
          # dispatch backfill 想走 resume（只補缺的學期）→ 把 force 設 false。
          if [ "$FORCE" = "false" ]; then
            python -m ntut_catalog crawl --terms "$TERMS" --out data
          else
            python -m ntut_catalog crawl --terms "$TERMS" --force --out data
          fi

      # 微學程為次要 enrichment 來源，失敗不得阻斷每日 catalog/enrollment 的 commit 與 publish（當日 mprograms 維持 stale）
      - name: Crawl micro-programs
        continue-on-error: true
        env:
          TERMS: ${{ steps.terms.outputs.terms }}
        run: |
          set -euo pipefail
          python -m ntut_catalog crawl-mprograms --terms "$TERMS" --out data

      # 行事曆事件 feed（契約四）。來源是校網的 Google Calendar，與課程目錄無關：
      # 失敗不得阻斷每日 catalog/enrollment 的 commit 與 publish（當日 calendar 維持 stale）。
      # 內容沒變時 crawl-calendar 不重寫 canonical，所以不會製造噪音 commit。
      - name: Crawl academic calendar (ics)
        id: calendar
        continue-on-error: true
        run: |
          set -euo pipefail
          python -m ntut_catalog crawl-calendar --out data

      # horizon 監測：涵蓋不到下一學年度 → 開 issue；補上了 → 自動關。告警不阻斷發布。
      - name: Calendar horizon alert
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python infra/calendar_horizon_alert.py data

      # 新造字監測：發現 PUA_MAP 未收錄碼位 → fail-loud 紅標但不擋每日管線（commit/publish 照常）。
      # 處置：照 docs/research/2026-07-20-pua-glyph-verification.md 的 GServer 流程考證補 PUA_MAP。
      - name: PUA scan (新造字監測)
        continue-on-error: true
        env:
          TERMS: ${{ steps.terms.outputs.terms }}
        run: |
          set -euo pipefail
          python -m ntut_catalog pua-scan --terms "$TERMS" --out data

      - name: Redline scan (block PII/secrets/error pages)
        run: python infra/redline_scan.py data/canonical

      - name: Commit canonical to data branch
        working-directory: data/canonical
        env:
          TERMS: ${{ steps.terms.outputs.terms }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          DATE="$(TZ=Asia/Taipei date +%F)"
          git add -- '*/catalog.ndjson' '*/classes.json' '*/mprograms.json' || true
          git diff --cached --quiet || git commit -m "data(catalog): $TERMS $DATE"
          git add -- '*/enrollment/*.ndjson' || true
          git diff --cached --quiet || git commit -m "data(enrollment): $TERMS $DATE"
          # 行事曆是跨學期的 top-level 目錄，不吃上面那些 '*/xxx' 的逐學期 glob，要指名。
          # 內容沒變時 crawl-calendar 不重寫檔案 → 這裡自然無 diff、不會產生空 commit，
          # 所以 data branch 上每一個 data(calendar) commit 都代表學校真的改了行事曆。
          git add -- 'calendar/events.ndjson' 'calendar/meta.json' '*/calendar.json' || true
          git diff --cached --quiet || git commit -m "data(calendar): $DATE"
          git pull --rebase origin data || true
          git push origin HEAD:data

      - name: Publish v1 to R2
        env:
          TERMS: ${{ steps.terms.outputs.terms }}
          PREV_COUNTS: ${{ steps.prev.outputs.counts }}
        run: |
          python infra/publish.py \
            --bucket "$R2_BUCKET" \
            --terms "$TERMS" \
            --out data \
            --min-ratio "$MIN_RATIO" \
            --previous-counts "$PREV_COUNTS" \
            --generated-at "$(date -u +%FT%TZ)"

      # 行事曆失敗不擋 catalog/enrollment 的發布（上面 continue-on-error），但**必須讓 job 紅**，
      # 否則「校方改了事件措辭、週次表停在上一版」會靜默過去——這正是換源要消滅的失效模式。
      # 放在 publish 之後：舊版 calendar 已隨本次發布保留，這裡只負責叫人。
      - name: Fail if calendar step failed
        if: steps.calendar.outcome == 'failure'
        run: |
          echo "::error title=行事曆抓取或週次表推導失敗::本次沿用上一版 calendar；catalog/enrollment 已照常發布。常見原因：校方改了事件標題措辭（不變量⑧）或週次表與校方公告不符（不變量⑩）。"
          exit 1
