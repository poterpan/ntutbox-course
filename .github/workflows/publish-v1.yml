name: publish v1 to R2

# 手動：從 data branch derive 完整 v1 並發佈到 R2。不爬學校，只 derive + 上傳。
# 用於：parser／PUA／model 這類只動 derive 的變更上線、看刪除清單（dry-run）、
# 放行刪除保險（allow_mass_delete）、改 Cache-Control 後強制全傳（no_skip_unchanged）。
# publish 一律全量比對（含 course/{id}.json），不再需要選學期或「是否帶詳情」。
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "只印上傳／刪除清單（寫進 run summary），不動 R2"
        type: boolean
        default: true
      allow_mass_delete:
        description: "放行刪除保險的 prefix（逗號分隔，如 115-1,114-2,standards,calendar）；留空＝不放行"
        required: false
        default: ""
      no_skip_unchanged:
        description: "不做 MD5 比對、全部重傳（改 Cache-Control 等 metadata 時用；約 3.3 萬物件）"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: data-pipeline
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      R2_BUCKET: ${{ vars.R2_BUCKET }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # R2 的 S3 相容憑證。與 CLOUDFLARE_API_TOKEN 來自**同一組** R2 API Token
      # （建立時一次給三個值），設了才會走批次上傳；沒設會回退 wrangler 逐檔——
      # 而那條回退路徑實測拿 403（CLOUDFLARE_API_TOKEN 寫不了 R2 物件），
      # 等於沒設就完全發不出去。其餘五個 workflow 本來就都帶著這兩個。
      # 對照表見 docs/ARCHITECTURE.md §6。
      R2_S3_ACCESS_KEY_ID: ${{ secrets.R2_S3_ACCESS_KEY_ID }}
      R2_S3_SECRET_ACCESS_KEY: ${{ secrets.R2_S3_SECRET_ACCESS_KEY }}
      QUALITY_MIN_RATIO: ${{ vars.QUALITY_MIN_RATIO }}
      INPUT_DRY_RUN: ${{ github.event.inputs.dry_run }}
      INPUT_ALLOW: ${{ github.event.inputs.allow_mass_delete }}
      INPUT_NO_SKIP: ${{ github.event.inputs.no_skip_unchanged }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: data
          path: data/canonical
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install crawler
        run: pip install -e ./crawler
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install wrangler
        run: npm install -g wrangler@4
      - name: Derive v1
        run: python -m ntut_catalog derive --out data
      # 不可信輸入只經由 env 注入、以陣列傳參（防 command injection）；prefix 格式由 publish.py 驗證。
      - name: Publish
        run: |
          set -euo pipefail
          ARGS=(--bucket "$R2_BUCKET" --out data)
          if [ "$INPUT_DRY_RUN" = "true" ]; then ARGS+=(--dry-run); fi
          if [ "$INPUT_NO_SKIP" = "true" ]; then ARGS+=(--no-skip-unchanged); fi
          if [ -n "$INPUT_ALLOW" ]; then ARGS+=(--allow-mass-delete "$INPUT_ALLOW"); fi
          python infra/publish.py "${ARGS[@]}"
