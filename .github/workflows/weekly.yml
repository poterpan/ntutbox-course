name: weekly

# 每週一 05:30 Asia/Taipei（= 週日 21:30 UTC）：登錄表 cadence=weekly 的資料集（details 課綱、
# standards 課程標準）。結構與 daily 相同（fetch 不上鎖＋commit-publish 上鎖），只差 cadence 與 timeout；
# 行事曆與資料過期檢查只在 daily 跑。details 的學期規則是 current-term——學期交界時預設學期何時切換
# 要人工確認（spec §2），需要時 dispatch 帶 terms。
on:
  # TEMPORARY（演練，最後一個 commit 移除）：push 到 refactor/pipeline-v2 → data-dryrun＋publish --dry-run
  push:
    branches: [refactor/pipeline-v2]
  schedule:
    - cron: "30 21 * * 0"
  workflow_dispatch:
    inputs:
      datasets:
        description: "只跑這些資料集（逗號分隔，如 details,standards）；留空＝weekly 全部"
        required: false
        default: ""
      terms:
        description: "學期（如 115-1 或 114-2:115-1）；留空＝登錄表規則（ACTIVE_TERMS 或 current-term）"
        required: false
        default: ""
      data_ref:
        description: "（演練用）data branch；正式一律 data"
        required: false
        default: data
      publish_dry_run:
        description: "（演練用）publish 只印清單不動 R2"
        type: boolean
        default: false
      alert_dry_run:
        description: "（演練用）告警只印不開 issue"
        type: boolean
        default: false

permissions:
  contents: read

env:
  DATA_REF: ${{ github.event_name == 'push' && 'data-dryrun' || inputs.data_ref || 'data' }}
  PUBLISH_DRY_RUN: ${{ (github.event_name == 'push' || inputs.publish_dry_run == true) && 'true' || 'false' }}
  ALERT_DRY_RUN: ${{ (github.event_name == 'push' || inputs.alert_dry_run == true) && 'true' || 'false' }}

jobs:
  fetch:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          data-ref: ${{ env.DATA_REF }}

      # 不可信輸入只經由 env 注入、以陣列傳參（防 command injection）。
      # exit 1（部分資料集失敗）照樣交給 commit-publish：成功的照常上線，失敗的由告警開 issue；
      # exit 2（用法錯誤）或沒產出 pipeline-result.json（整支掛掉）→ 這個 job 紅燈、不 commit。
      - name: pipeline --cadence weekly
        env:
          INPUT_DATASETS: ${{ inputs.datasets }}
          INPUT_TERMS: ${{ inputs.terms }}
          ACTIVE_TERMS: ${{ vars.ACTIVE_TERMS }}
        run: |
          set +e -uo pipefail   # 要自己拿結束碼：預設 shell 帶 -e
          ARGS=(--cadence weekly --out data --stage "$RUNNER_TEMP/stage")
          if [ -n "$INPUT_DATASETS" ]; then ARGS+=(--datasets "$INPUT_DATASETS"); fi
          if [ -n "$INPUT_TERMS" ]; then
            echo "$INPUT_TERMS" | grep -Eq '^[0-9]{3}-[123]([:,][0-9]{3}-[123])*$' \
              || { echo "invalid terms: $INPUT_TERMS"; exit 2; }
            ARGS+=(--terms "$INPUT_TERMS")
          fi
          python -m ntut_catalog pipeline "${ARGS[@]}"
          code=$?
          [ -f "$RUNNER_TEMP/stage/pipeline-result.json" ] || { echo "no pipeline-result.json (exit $code)"; exit 1; }
          if [ "$code" -eq 1 ]; then echo "::warning title=部分資料集失敗::見 pipeline-result.json；成功者照常合併"; exit 0; fi
          exit "$code"

      - name: Upload stage
        uses: actions/upload-artifact@v7
        with:
          name: stage-weekly
          path: ${{ runner.temp }}/stage
          if-no-files-found: error
          retention-days: 7

  commit-publish:
    needs: fetch
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    concurrency:
      group: ${{ github.event_name == 'push' && 'data-pipeline-dryrun' || 'data-pipeline' }}
      cancel-in-progress: false
    outputs:
      publish-exit: ${{ steps.cp.outputs.publish-exit }}
      deletions-skipped: ${{ steps.cp.outputs.deletions-skipped }}
    env:
      R2_BUCKET: ${{ vars.R2_BUCKET }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # R2 的 S3 相容憑證（與 CLOUDFLARE_API_TOKEN 同一組 R2 API Token；對照表 docs/ARCHITECTURE.md §6）。
      R2_S3_ACCESS_KEY_ID: ${{ secrets.R2_S3_ACCESS_KEY_ID }}
      R2_S3_SECRET_ACCESS_KEY: ${{ secrets.R2_S3_SECRET_ACCESS_KEY }}
      QUALITY_MIN_RATIO: ${{ vars.QUALITY_MIN_RATIO }}
    steps:
      - uses: actions/checkout@v7
      # 鎖內重新 checkout **最新** data branch（fetch job 那份可能已過期）
      - uses: ./.github/actions/setup
        with:
          data-ref: ${{ env.DATA_REF }}
      - uses: actions/download-artifact@v8
        with:
          pattern: stage-*
          path: ${{ runner.temp }}/stages
      - id: cp
        uses: ./.github/actions/commit-publish
        with:
          cadence: weekly
          stages: ${{ runner.temp }}/stages
          data-ref: ${{ env.DATA_REF }}
          publish-dry-run: ${{ env.PUBLISH_DRY_RUN }}
          daily-checks: "false"
          alert-dry-run: ${{ env.ALERT_DRY_RUN }}

  alert:
    needs: [fetch, commit-publish]
    if: always()
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/alert
        with:
          workflow: weekly
          needs-json: ${{ toJSON(needs) }}
          publish-exit: ${{ needs.commit-publish.outputs.publish-exit }}
          deletions-skipped: ${{ needs.commit-publish.outputs.deletions-skipped }}
          dry-run: ${{ env.ALERT_DRY_RUN }}
