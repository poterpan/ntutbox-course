[project]
name = "ntut-catalog-crawler"
version = "0.1.0"
description = "北科課程目錄爬蟲：aps.ntut.edu.tw/course/tw/ → typed v1 catalog (canonical NDJSON + JSON artifacts)"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "html5lib>=1.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "freezegun>=1.5"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["ntut_catalog"]
py-modules = ["models"]

# 週次表回歸基準（從校方公告 PDF 抽出的 10 個學期答案）。這份在**發佈時**跑，
# 不是只在 pytest 跑，所以必須隨套件安裝——見交接文件 §4 不變量⑩。
[tool.setuptools.package-data]
ntut_catalog = ["reference/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
